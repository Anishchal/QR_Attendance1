<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal - Staff & Student Login/Register</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        /* Modal Overlay */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-box {
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            width: 350px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            text-align: center;
        }
        .modal-box h2 { margin-top: 0; color: #333; }
        .btn-group { display: flex; gap: 10px; justify-content: center; margin-top: 20px; }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            color: white;
        }
        .btn-staff { background-color: #007BFF; }
        .btn-student { background-color: #28A745; }
        .btn:hover { opacity: 0.9; }

        /* Form Container */
        .form-container { display: none; text-align: left; }
        .form-container input {
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .form-container label { font-size: 14px; font-weight: bold; color: #555; }
        .submit-btn { width: 100%; background-color: #333; color: white; padding: 10px; border: none; border-radius: 4px; cursor: pointer; }
        .toggle-link { margin-top: 15px; font-size: 13px; text-align: center; color: #007BFF; cursor: pointer; }
        .back-link { font-size: 12px; color: #666; cursor: pointer; margin-top: 10px; display: block; text-align: center; }
        .loading { display: none; color: #007BFF; font-size: 14px; margin-top: 10px; text-align: center; }
    </style>
</head>
<body>

    <!-- Popup Modal -->
    <div class="modal-overlay" id="portalModal">
        <div class="modal-box">
            
            <!-- Step 1: Selection Prompt -->
            <div id="selectionStep">
                <h2>Welcome</h2>
                <p>Please select your user category to proceed:</p>
                <div class="btn-group">
                    <button class="btn btn-staff" onclick="selectUserType('Staff')">Staff</button>
                    <button class="btn btn-student" onclick="selectUserType('Student')">Student</button>
                </div>
            </div>

            <!-- Step 2: Form (Register / Login) -->
            <div id="formStep" class="form-container">
                <h2 id="formTitle">Register</h2>
                <form id="authForm" onsubmit="handleSubmit(event)">
                    
                    <div id="registerFields">
                        <label>Full Name</label>
                        <input type="text" id="fullName" placeholder="Enter full name">
                        
                        <label id="idLabel">Student/Staff ID Number</label>
                        <input type="text" id="idNumber" placeholder="Enter ID number">
                    </div>

                    <label>Email Address</label>
                    <input type="email" id="email" required placeholder="Enter email">

                    <label>Password</label>
                    <input type="password" id="password" required placeholder="Enter password">

                    <button type="submit" class="submit-btn" id="submitBtnText">Register</button>
                    <div class="loading" id="loadingText">Processing, please wait...</div>
                </form>

                <div class="toggle-link" id="toggleText" onclick="toggleMode()">Already registered? Login here</div>
                <span class="back-link" onclick="resetModal()">« Change User Type</span>
            </div>

        </div>
    </div>

    <script>
        // REPLACE WITH YOUR GOOGLE APPS SCRIPT WEB APP URL
        const SCRIPT_URL = "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE";

        let selectedUserType = "";
        let isLoginMode = false;

        function selectUserType(type) {
            selectedUserType = type;
            document.getElementById('selectionStep').style.display = 'none';
            document.getElementById('formStep').style.display = 'block';
            updateFormView();
        }

        function resetModal() {
            document.getElementById('formStep').style.display = 'none';
            document.getElementById('selectionStep').style.display = 'block';
            document.getElementById('authForm').reset();
            isLoginMode = false;
        }

        function toggleMode() {
            isLoginMode = !isLoginMode;
            updateFormView();
        }

        function updateFormView() {
            const title = `${selectedUserType} ${isLoginMode ? 'Login' : 'Registration'}`;
            document.getElementById('formTitle').innerText = title;
            document.getElementById('submitBtnText').innerText = isLoginMode ? 'Login' : 'Register';
            
            // Hide name and ID fields if logging in
            document.getElementById('registerFields').style.display = isLoginMode ? 'none' : 'block';
            document.getElementById('fullName').required = !isLoginMode;
            document.getElementById('idNumber').required = !isLoginMode;

            document.getElementById('toggleText').innerText = isLoginMode ? 
                "First time user? Register here" : 
                "Already registered? Login here";
        }

        function handleSubmit(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const fullName = document.getElementById('fullName').value;
            const idNumber = document.getElementById('idNumber').value;

            const payload = {
                action: isLoginMode ? "login" : "register",
                userType: selectedUserType,
                email: email,
                password: password,
                fullName: fullName,
                idNumber: idNumber
            };

            document.getElementById('loadingText').style.display = 'block';

            // Send data to Google Apps Script backend
            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors', // Required for Google Apps Script endpoints
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(() => {
                document.getElementById('loadingText').style.display = 'none';
                alert(isLoginMode ? "Login request processed!" : "Registration complete! Data saved to Google Sheets.");
                document.getElementById('portalModal').style.display = 'none'; // Close modal on success
            })
            .catch(error => {
                document.getElementById('loadingText').style.display = 'none';
                alert("An error occurred: " + error);
            });
        }
    </script>
</body>
</html>
